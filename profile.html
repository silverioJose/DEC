    <br>
 <div class= "container">

    <input type="number" id="progressInput" min="0" max="100" placeholder="Enter %">
    <button onclick="updateProgress()">Update</button>

</div>

<script>
    function updateProgress() {
  const input = document.getElementById("progressInput").value;
  const progress = document.getElementById("progress");

  let value = Math.max(0, Math.min(100, input)); // keep between 0–100

  progress.style.width = value + "%";
  progress.textContent = value + "%";
}
</script>
